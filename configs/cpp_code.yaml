# Configuration for C++ Source Code Model (llama.cpp Corpus)

dataset:
  name: "llama_cpp"
  source: "ggml-org/llama.cpp C++ codebase"
  vocab_path: "data/vocabularies/cpp/stoi_cpp.pkl"
  itos_path: "data/vocabularies/cpp/itos_cpp.pkl"
  vocab_csv: "data/vocabularies/cpp/cpp_vocabulary.csv"
  vocab_size: 43226
  context_size: 5

model:
  architecture: "NextTokenPredictor"
  embed_dim: 64
  hidden_dim: 256
  activation: "relu"
  checkpoint_path: "checkpoints/cpp/cpp_next_token_model2.pt"

training:
  batch_size: 1024
  epochs: 300
  learning_rate: 0.001
  optimizer: "AdamW"

inference:
  temperature: 0.8
  top_k: 15
  default_prompt: "int calculate_total(int count)"
  max_new_tokens: 15
